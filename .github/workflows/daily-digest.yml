name: Daily News Digest

on:
  # Manual only — scheduled sending is handled by `.github/workflows/digest.yml`
  workflow_dispatch: # Allow manual trigger

# Grant write permissions for pushing updates
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Daily Digest
        env:
          # API Keys
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          
          # Email Config (Matching your GitHub Secrets)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          
          # Use GMAIL_RECIPIENT secret for the RECEIVER_EMAIL variable
          RECEIVER_EMAIL: ${{ secrets.GMAIL_RECIPIENT }}
          
        run: node test-run.js

      - name: Commit and Push latest report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/latest_digest.html
          git commit -m "Update latest digest report [skip ci]" || echo "No changes to commit"
          git push
