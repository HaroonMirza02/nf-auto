name: Daily News Digest

on:
  schedule:
    # 5:00 AM UTC is 10:00 AM PKT
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Daily Digest
        env:
          # API Keys
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          
          # Email Config (Matching your GitHub Secrets)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          
          # Use GMAIL_RECIPIENT secret for the RECEIVER_EMAIL variable
          RECEIVER_EMAIL: ${{ secrets.GMAIL_RECIPIENT }}
          
        run: node test-run.js
